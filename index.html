<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kariyer Öz Değerlendirme Asistanı</title>
<style>
:root{
  --bg:#fff4e8; --card:#fffdf9; --ink:#2b2018; --muted:#7a6554; --line:#f1ddc9;
  --brand:#d9480f; --brand-ink:#ffffff; --brand-soft:#ffe9d9; --good:#1b7a52; --good-soft:#dff3e8;
  --warn:#b45309; --warn-soft:#fff0cf; --bad:#b42318;
  --teal:#0e8a8c; --gold:#f2a516; --plum:#a23b72;
  --g0:linear-gradient(120deg,#ff7a45,#f7a23a); --g1:linear-gradient(120deg,#14a3a0,#5bbf7a);
  --g2:linear-gradient(120deg,#f2a516,#ee7b30); --g3:linear-gradient(120deg,#a23b72,#e4657d);
  --g4:linear-gradient(120deg,#e4657d,#f5a45d); --gh:linear-gradient(120deg,#ff7a45 0%,#f7a23a 55%,#f6c453 100%);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1c1511; --card:#261c16; --ink:#f6eadf; --muted:#c3ab97; --line:#41302a;
  --brand:#ff8a55; --brand-ink:#2a1306; --brand-soft:#3b2518; --good:#59d29b; --good-soft:#153326;
  --warn:#f5bb62; --warn-soft:#3a2b0e; --bad:#f08a80; --teal:#4cc9c6; --gold:#f5be4a; --plum:#e07db0;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
header.top{display:flex;align-items:center;gap:12px;padding:20px 0 8px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700}
header.top h1{font-size:18px;margin:0}
header.top p{margin:0;color:var(--muted);font-size:13px}
.stepper{display:flex;gap:8px;margin:12px 0 20px}
.stepper div{flex:1;font-size:12px;color:var(--muted);border-top:3px solid var(--line);padding-top:6px}
.stepper div.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.stepper div.done{border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.bubble{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px}
.bubble .txt{background:var(--brand-soft);border-radius:4px 14px 14px 14px;padding:12px 16px}
.bubble .txt .tag{font-size:12px;color:var(--brand);font-weight:600;margin-bottom:4px;letter-spacing:.02em}
.bubble .txt p{margin:0}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
select,input[type=text]{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.opts{display:grid;gap:10px}
.opt{text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;display:flex;gap:12px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--brand);background:var(--brand-soft)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:11px 20px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.prog-bar{height:4px;background:var(--line);border-radius:4px;margin-bottom:16px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--brand);transition:width .3s}
/* sıcak tema + görseller */
body{background:var(--bg) radial-gradient(circle at 100% 0,rgba(247,162,58,.18),transparent 45%) no-repeat}
.logo{background:var(--gh);color:#fff;box-shadow:0 4px 12px rgba(217,72,15,.3)}
.card{box-shadow:0 6px 24px rgba(160,90,40,.08)}
.hero-banner{margin:-22px -22px 20px;border-radius:14px 14px 0 0;background:var(--gh);overflow:hidden}
.hero-banner svg{display:block;width:100%;height:auto}
.banner{margin:-22px -22px 18px;border-radius:14px 14px 0 0;overflow:hidden;height:96px}
.banner svg{display:block;width:100%;height:100%}
/* kapak sayfası */
.cover-hero{margin:-22px -22px 0;border-radius:14px 14px 0 0;background:linear-gradient(160deg,#ff7a45 0%,#f7a23a 55%,#f6c453 100%);overflow:hidden}
.cover-hero svg{display:block;width:100%;height:auto}
.cover-title{text-align:center;margin:20px 0 4px;font-size:28px;line-height:1.2;font-weight:800}
.cover-title span{color:var(--brand)}
.cover-sub{text-align:center;color:var(--muted);margin:0 auto 18px;max-width:560px}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.info{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card)}
.info .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:8px;color:#fff}
.info .ic svg{width:22px;height:22px}
.info:nth-child(1) .ic{background:var(--g1)} .info:nth-child(2) .ic{background:var(--g0)} .info:nth-child(3) .ic{background:var(--g3)}
.info h4{margin:0 0 4px;font-size:15px} .info p{margin:0;font-size:13.5px;color:var(--muted)}
.consent{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--brand-soft);cursor:pointer;margin:0;font-weight:500;font-size:14.5px}
.consent input{flex:none;width:20px;height:20px;margin-top:2px;accent-color:var(--brand)}
.fine{font-size:12px;color:var(--muted);margin:10px 0 0}
.cta{display:block;width:100%;margin-top:14px;font-size:17px;padding:14px}
@keyframes flo{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(6deg)}}
@keyframes twk{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.cover-hero .flo{animation:flo 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cover-hero .flo.d2{animation-delay:-1.2s} .cover-hero .flo.d3{animation-delay:-2.2s}
.cover-hero .twk{animation:twk 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cover-hero .twk.d2{animation-delay:-.8s} .cover-hero .twk.d3{animation-delay:-1.6s}
@media (prefers-reduced-motion:reduce){.cover-hero .flo,.cover-hero .twk{animation:none}}
@media (max-width:640px){.info-grid{grid-template-columns:1fr}.cover-title{font-size:23px}.cover-hero{margin:-16px -16px 0}}
.b5{background:linear-gradient(120deg,#0e8a8c,#a23b72)}
.b6{background:linear-gradient(120deg,#f2a516,#d9480f)}
.sec.c7{--c:var(--gold)}
.sec.c8{--c:var(--plum)}
.sec.c6{--c:var(--teal)}
.disc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.disc.top{border-color:var(--teal);background:var(--good-soft)}
.disc .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:600}
.disc .parts{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.disc p{margin:4px 0 0;font-size:13.5px}
.b0{background:var(--g0)}.b1{background:var(--g1)}.b2{background:var(--g2)}.b3{background:var(--g3)}.b4{background:var(--g4)}
.prog-bar{background:var(--line)} .prog-bar i{background:var(--gh)}
.avatar{background:var(--gh);color:#fff}
.bubble .txt{border:1px solid var(--line)}
.opt .k{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.opt:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(160,90,40,.12)}
.btn{background:var(--gh);border:0;color:#fff;box-shadow:0 3px 10px rgba(217,72,15,.25)}
.btn.ghost{background:transparent;border:1px solid var(--brand);color:var(--brand);box-shadow:none}
.stepper div{border-top-width:4px;border-radius:4px}
.stepper div.on,.stepper div.done{border-color:var(--gold)}
.sec{border-top:4px solid var(--c,var(--brand))}
.sec.c1{--c:var(--brand)} .sec.c2{--c:var(--teal)} .sec.c3{--c:var(--gold)} .sec.c4{--c:var(--plum)} .sec.c5{--c:var(--good)}
.sec h3{display:flex;align-items:center;gap:8px}
.ico{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--c,var(--brand));color:#fff}
.ico svg{width:17px;height:17px}
.sec.hero-sec{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--brand-soft),var(--card) 70%)}
.sec.hero-sec .deco{position:absolute;right:-10px;bottom:-6px;width:230px;opacity:.95;pointer-events:none}
.sec.hero-sec .hero>div:last-child{padding-right:130px}
.chip.good{background:var(--good-soft)}
.bar .t b{background:var(--g0)}
.phase{background:linear-gradient(180deg,var(--brand-soft),transparent 60%)}
.phase:nth-child(2){background:linear-gradient(180deg,#e0f4f2,transparent 60%)}
.phase:nth-child(3){background:linear-gradient(180deg,#fff0cf,transparent 60%)}
@media (prefers-color-scheme:dark){.phase:nth-child(2){background:linear-gradient(180deg,#12302f,transparent 60%)}.phase:nth-child(3){background:linear-gradient(180deg,#3a2b0e,transparent 60%)}}
@media (max-width:640px){.sec.hero-sec .deco{display:none}.sec.hero-sec .hero>div:last-child{padding-right:0}}
/* report */
.rep h2{font-size:20px;margin:0 0 4px}
.rep h3{font-size:16px;margin:0 0 10px}
.meta{color:var(--muted);font-size:13px;margin-bottom:18px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;break-inside:avoid}
.hero{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:center}
.hero .big{font-size:13px;color:var(--muted)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand);margin:0 6px 6px 0}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bar{margin:10px 0}
.bar .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bar .t{height:9px;background:var(--line);border-radius:9px;position:relative}
.bar .t b{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--brand)}
.bar .t u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.7}
.gap{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:12px 0}
.gap.g{border-color:var(--good)} .gap.w{border-color:var(--warn)}
.gap h4{margin:0;font-size:14px} .gap p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.route{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.route.rec{border-color:var(--brand);background:var(--brand-soft)}
.route h4{margin:0 0 2px;font-size:15px}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.phase{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px}
.phase h5{margin:0 0 6px;font-size:13px;color:var(--brand)}
.phase ul{margin:0;padding-left:18px} .phase li{margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
@media (max-width:640px){
  .hero,.two,.phases{grid-template-columns:1fr}
  .wrap{padding:0 12px 48px}
  .card{padding:16px}
  .hero-banner,.banner{margin:-16px -16px 14px}
  .banner{height:80px}
  header.top{padding:14px 0 4px}
  header.top h1{font-size:16px} header.top p{font-size:12px}
  .stepper{gap:6px;margin:8px 0 14px} .stepper div{font-size:11px}
  .bubble{gap:8px;margin-bottom:14px}
  .avatar{width:30px;height:30px;font-size:12px}
  .bubble .txt{padding:10px 12px}
  .bubble .txt p{font-size:15px}
  .opt{padding:11px 12px;gap:10px;font-size:15px}
  .row{flex-wrap:nowrap}
  .row .btn{flex:1;padding:12px 10px}
  .sec{padding:16px}
  .rep h2{font-size:18px}
  .hero{justify-items:center;text-align:center}
  .hero>div:last-child{text-align:left}
  .disc .h{flex-direction:column;align-items:flex-start}
  .actions .btn{flex:1 1 100%}
}
@media print{
  @page{margin:14mm}
  :root{--bg:#fff;--card:#fff;--ink:#111;--muted:#444;--line:#ecd9c6;--brand:#d9480f;--brand-soft:#ffeee0;--good:#1b7a52;--good-soft:#e3f4ec;--warn:#b45309;--warn-soft:#fff0cf;--teal:#0e8a8c;--gold:#f2a516;--plum:#a23b72}
  body{background:#fff!important}.hero-banner,.banner{display:none}.sec.hero-sec .deco{width:170px}
  body{background:#fff;font-size:12.5px}
  .no-print,header.top p,.stepper{display:none!important}
  .wrap{max-width:none;padding:0}
  .sec{break-inside:avoid;box-shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">K</div>
    <div><h1>Kariyer Öz Değerlendirme Asistanı</h1><p>Diagnostik &amp; medikal teknoloji saha, aplikasyon ve atölye ekipleri için</p></div>
  </header>
  <div class="stepper no-print" id="stepper">
    <div id="s1">1 · Tanışma</div><div id="s2">2 · Değerlendirme</div><div id="s3">3 · Rapor</div>
  </div>
  <main id="app"></main>
</div>

<script>
/* ============ VERİ ============ */
const TITLES = [
  {v:"Saha Servis Mühendisi", f:"field", s:0},
  {v:"Kıdemli Saha Servis Mühendisi", f:"field", s:1},
  {v:"Aplikasyon Uzmanı", f:"app", s:0},
  {v:"Kıdemli Aplikasyon Uzmanı", f:"app", s:1},
  {v:"Atölye Destek Teknisyeni / Uzmanı", f:"work", s:0},
  {v:"Kıdemli Atölye Destek Uzmanı", f:"work", s:1}
];
/* Hedef yalnızca bir üst basamak veya yatay geçiş olabilir; mevcut rolün kendisi/altı ve kendi alanına yatay geçiş çıkmaz */
const eligible=(t,title)=>{
  if(t.id==="senior") return title.s===0;
  return true;
};
const YEARS = [
  {v:"1 yıldan az", n:0.5},{v:"1–3 yıl", n:2},{v:"3–5 yıl", n:4},{v:"5–10 yıl", n:7.5},{v:"10 yıldan fazla", n:12}
];
/* req: dreyfus, tech, human, conc | type: vertical | expert | lateral */
const TARGETS = [
  {id:"senior", n:"Kıdemli Uzman / Teknik Referans (SME)", type:"expert", req:[4,85,65,55]},
  {id:"lead", n:"Takım Lideri / Teknik Lider", type:"vertical", req:[4,75,75,65]},
  {id:"mgr", n:"Manager (Servis / Destek Müdürü)", type:"vertical", req:[4,65,80,85]},
  {id:"trainer", n:"Teknik Eğitmen / Trainer", type:"lateral", req:[4,75,85,55]},
  {id:"prod", n:"Ürün / Çözüm Uzmanı (Product Specialist)", type:"lateral", req:[4,75,75,70]}
];
const ANCHORS = {
  TF:"Teknik / Fonksiyonel Yetkinlik", GM:"Genel Yönetim", AU:"Özerklik / Bağımsızlık", SE:"Güvenlik / İstikrar",
  EC:"Girişimci Yaratıcılık", SV:"Hizmet / Adanmışlık", CH:"Saf Meydan Okuma", LS:"Yaşam Tarzı Dengesi"
};
const DREYFUS = ["", "Acemi (Novice)", "İleri Başlangıç (Advanced Beginner)", "Yetkin (Competent)", "Usta / Profesyonel (Proficient)", "Uzman (Expert)"];

/* seçenek: text, d (Dreyfus 1-5), t/h/c (Katz 0-4), a (Schein çıpa ağırlıkları) */
const O = (text,d,t,h,c,a)=>({text,d,t,h,c,a:a||{}});

const QUESTIONS = [
 { tag:"Teknik Uzmanlık · Dreyfus",
   scenario(ctx){
     return {
       field:"Gece vardiyasında hastanedeki kritik bir analizör hata veriyor ve laboratuvarda numuneler birikiyor. Hata kodu karşınıza ilk kez çıkıyor ve servis kılavuzu net bir yol göstermiyor. Ne yaparsınız?",
       app:"Yeni kurulan bir testin kalite kontrol sonuçları laboratuvarda tutarsız çıkıyor, müşteri ise hasta sonuçlarını bir an önce vermek istiyor. Nasıl ilerlersiniz?",
       work:"Atölyeye gelen bir modülün arızası test düzeneğinde tekrarlanamıyor (aralıklı arıza), saha ise acil değişim bekliyor. Ne yaparsınız?"
     }[ctx.family==="lead"?"field":ctx.family];
   },
   options(ctx){
     const T={
      field:["Kılavuzdaki adımları sırayla uygular, çözülmezse hemen Global 2. level destek ekibine eskale ederim.",
             "Belirtileri ve son değişiklikleri (bakım, kalibrasyon, reaktif lotu) analiz ederek kök neden hipotezi kurar, test eder; gerekirse Global 2. level destek ekibini paralelde bilgilendirir ve loglarla desteklerim.",
             "Önce laboratuvarı geçici çözümle çalışır hale getirir, sonra kök neden analizi yapar ve benzer arızalar için bir bilgi notu yazarım.",
             "Müdahale etmeden önce yöneticimden onay alır, onay gelmeden işlem yapmam."],
      app:["Üretici prosedürünü adım adım uygular, sonuç değişmezse Global 2. level destek ekibine eskale ederim.",
           "Kalibratör, reaktif, kontrol lotu ve cihaz parametrelerini sistematik karşılaştırır, değişkenleri tek tek izole ederek sebebi daraltırım.",
           "Sonuçların kullanımını riskine göre durdurur/sınırlar, kök nedeni bulur ve laboratuvar için doğrulama planı ile kalıcı bir kontrol önerisi hazırlarım.",
           "Karar sorumluluğunu almadan önce yöneticimden onay alırım."],
      work:["Servis prosedürüne göre standart testleri yapar, bulgu çıkmazsa modülü 'arıza bulunamadı' diye iade ederim.",
            "Arıza geçmişi, çalışma koşulları ve bileşenleri analiz eder, stres/uzatılmış testlerle arızayı tetiklemeye çalışırım.",
            "Sahaya yedeği hızla çıkarır, arızalı modülü kök neden için incelemeye devam eder ve bulguları tüm atölye için dokümante ederim.",
            "Kararı ekip lideri vermeden ilerlemem, onay beklerim."]
     }[ctx.family==="lead"?"field":ctx.family];
     return [
       O(T[0],2,1,1,0,{SE:2}),
       O(T[1],4,3,2,2,{TF:2}),
       O(T[2],5,4,3,3,{TF:1,SV:1,GM:1}),
       O(T[3],1,0,1,0,{SE:2})
     ];
   }},
 { tag:"Beşeri Beceriler · Katz",
   scenario(ctx){
     return ctx.q1.d>=4
      ? "Çözümü bulduktan sonra, daha deneyimsiz bir meslektaşınızın aynı konuda müşteriye yanlış bilgi verdiğini öğreniyorsunuz. Nasıl yaklaşırsınız?"
      : "Laboratuvar şefi çözüm süresinin uzamasından dolayı sinirli ve sizi sorumlu tutuyor. Nasıl iletişim kurarsınız?";
   },
   options(ctx){
     return ctx.q1.d>=4 ? [
       O("Müşteriye düzeltmeyi hızla yapar, ardından meslektaşımla suçlamadan, birebir oturup nedenini birlikte analiz ederim.",4,2,4,2,{SV:1,GM:1}),
       O("Düzeltmeyi kendim yapar, meslektaşıma kısa bir e-postayla doğru bilgiyi iletirim.",3,2,2,1,{AU:1,TF:1}),
       O("Durumu yöneticime bildirir ve onun müdahalesini beklerim.",2,1,1,0,{SE:2}),
       O("Bilgi paylaşımı için ekibe bir vaka çalışması ve kısa eğitim hazırlar, ayrıca meslektaşıma düzenli koçluk yaparım.",5,3,4,4,{GM:2,SV:1})
     ] : [

function computeDisc(prof){
  const A=S.dAns;
  const pick=S.discMode==="pick";
  return DISC_KEYS.filter(k=>!pick||(S.discSel||[]).includes(k)).map(k=>{
    const D=DISC[k];
    // "pick" modunda ilgi, kullanıcının disiplini kendisinin seçmesinden (belirtilmiş ilgi) türetilir
    let interest=50;
    if(pick){
      const n=(S.discSel||[]).length;
      interest = n>=3 ? ([90,70,50,35][(A.pickInt||[]).indexOf(k)] ?? 50)
               : n===2 ? (A.pickInt===k?90:65)
               : ({hi:90,mid:75,low:55,unsure:40}[A.pickInt]||50);
      // doğrulama sorusu: göreli sıralamanın mutlak ilgiyi şişirmesini önler (sıra korunur)
      if(n>=2) interest *= ({hi:1,mid:.9,low:.75}[A.pickAbs]||1);
    } else { if(A.most===k) interest+=45; if(A.least===k && A.least!==A.most) interest-=45; }
    const item=DSTEPS.flatMap(s=>s.items||[]).find(x=>x.id===k);
    const apt=item.options[A[k]].score/4*100;
    const tr=Math.min(100,(A.skills||[]).reduce((a,i)=>a+(SKILLS[i].w[k]||0),0)/6*100);
    const pr=Math.max(0,Math.min(100,D.profile(prof)));
    const score=Math.round(.3*interest+.3*apt+.25*tr+.15*pr);
    return {k,D,score,parts:{interest:Math.round(interest),apt:Math.round(apt),tr:Math.round(tr),pr:Math.round(pr)}};
  }).sort((a,b)=>b.score-a.score);
}

function activeSteps(){
  if(S.discMode!=="pick") return DSTEPS;
  const items=DSTEPS.flatMap(s=>s.items||[]).filter(it=>(S.discSel||[]).includes(it.id));
  const sel=S.discSel||[];
  // Tek soruluk ilgi ölçümü: 2+ disiplinde "en çok cezbeden", tek disiplinde ilgi derecesi
  const steps=[ sel.length>=3
    ? {type:"rank", id:"pickInt", tag:"Disiplin Keşfi · İlgi Sıralaması",
       text:"Seçtiğiniz disiplinleri, bir iş gününü yaşamak istediğiniz sıraya dizin. En çok istediğinizden başlayarak tıklayın; sıra numarası kutuda görünür, yeniden tıklamak seçimi kaldırır.",
       options:()=>sel.map(k=>({v:k,text:DISC[k].day}))}
    : sel.length===2
    ? {type:"single", id:"pickInt", tag:"Disiplin Keşfi · İlgi",
       text:"Seçtiğiniz disiplinler arasında, bir iş gününü yaşamayı en çok hangisinde istersiniz?",
       options:()=>sel.map(k=>({v:k,text:DISC[k].day}))}
    : {type:"single", id:"pickInt", tag:"Disiplin Keşfi · İlgi",
       text:`${DISC[sel[0]].n} alanı sizi ne kadar cezbediyor? Bir iş günü şöyle: ${DISC[sel[0]].day}`,
       options:()=>[{v:"hi",text:"Çok; bu işi yapmak için sabırsızlanırım."},{v:"mid",text:"Ilımlı; ilgimi çekiyor, daha iyi tanımak isterim."},{v:"low",text:"Biraz; açıkçası merak ediyorum."},{v:"unsure",text:"Emin değilim; henüz yeterince tanımıyorum."}]} ];
  // Doğrulama: sıralama göreli bir ölçümdür; birinci tercihin mutlak ilgi düzeyini sorar
  if(sel.length>=2){
    const top=Array.isArray(S.dAns.pickInt)?S.dAns.pickInt[0]:S.dAns.pickInt;
    steps.push({type:"single", id:"pickAbs", tag:"Disiplin Keşfi · İlgi Doğrulama",
      text:`Birinci tercihiniz${top?` (${DISC[top].n})`:""} sizi gerçekten heyecanlandırıyor mu, yoksa seçeneklerin içinde yalnızca en az uzak olan mı?`,
      options:()=>[{v:"hi",text:"Gerçekten heyecanlandırıyor; bu alana geçmek için aktif adım atmaya hazırım."},
                   {v:"mid",text:"İlgimi çekiyor ama kesin değilim; önce yakından tanımak isterim."},
                   {v:"low",text:"Diğerlerinden yalnızca daha az uzak; asıl motivasyonum başka bir yerde."}]});
  }
  for(let i=0;i<items.length;i+=2)
    steps.push({type:"pair",tag:"Disiplin Keşfi · Yatkınlık",text:items.length-i>1?"Aşağıdaki iki durumda nasıl davranırdınız?":"Aşağıdaki durumda nasıl davranırdınız?",items:items.slice(i,i+2)});
  steps.push(DSTEPS[DSTEPS.length-1]);
  return steps;
}

function renderDisc(di){

  const groups = st.type==="pair" ? st.items.map(it=>({id:it.id,label:it.scenario,opts:it.options.map((o,i)=>({v:i,text:o.text}))}))
                                  : [{id:st.id,label:null,opts:st.options(),multi:st.type==="multi"||st.type==="rank",rank:st.type==="rank"}];
  const isSel=(g,v)=> g.multi ? (A[g.id]||[]).includes(v) : A[g.id]===v;
  const badge=(g,o,i)=> g.rank ? ((A[g.id]||[]).indexOf(o.v)+1||"") : g.multi ? (isSel(g,o.v)?"✓":"") : "ABCDEF"[i];
  const complete=()=> st.type==="multi" || groups.every(g=>g.rank ? (A[g.id]||[]).length===g.opts.length : A[g.id]!==undefined);
  const draw=()=>{
    app.innerHTML=`
    <div class="card">
      ${banner(5)}
      <div class="prog-bar"><i style="width:${(QUESTIONS.length+di)/(QUESTIONS.length+steps.length)*100}%"></i></div>
      <div class="bubble"><div class="avatar">M</div><div class="txt">
        <div class="tag">BÖLÜM 2 · ADIM ${di+1} / ${steps.length} · ${esc(st.tag)}</div>
        <p>${esc(st.text)}</p>
      </div></div>
      ${groups.map(g=>`<div style="margin-bottom:16px">
        ${g.label?`<p style="margin:0 0 8px;font-weight:600">${esc(g.label)}</p>`:""}
        <div class="opts" role="${g.multi?"group":"radiogroup"}">
          ${g.opts.map((o,i)=>`<button class="opt ${isSel(g,o.v)?"sel":""}" data-g="${g.id}" data-v="${o.v}" role="${g.multi?"checkbox":"radio"}" aria-checked="${isSel(g,o.v)}"><span class="k">${badge(g,o,i)}</span><span>${esc(o.text)}</span></button>`).join("")}
        </div></div>`).join("")}
      <div class="row">
        <button class="btn ghost" id="back">← Geri</button>
        <button class="btn" id="next" ${complete()?"":"disabled"}>${last?"Raporu oluştur":"Sonraki adım"} →</button>
      </div>
    </div>`;
    app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const g=groups.find(x=>x.id===b.dataset.g);

    app.querySelector("#next").addEventListener("click",()=>{ S.screen = last?"report":"d"+(di+1); render(); });
  };
  draw();
}

/* ============ HESAPLAMA ============ */
function compute(){
  const family=TITLES[S.titleIdx].f, years=YEARS[S.yearsIdx].n;
  let sumD=0,nD=0, T=0,H=0,C=0, mT=0,mH=0,mC=0;
  const anc={TF:0,GM:0,AU:0,SE:0,EC:0,SV:0,CH:0,LS:0};
  QUESTIONS.forEach((q,qi)=>{
    if(q.type==="rank") return;   // değer sıralaması motivasyon profiline girer, beceri puanına değil
    const opts=q.options(ctxFor(qi)), o=opts[S.answers[qi].i];
    if(o.d>0){sumD+=o.d;nD++}
    T+=o.t;H+=o.h;C+=o.c;
    mT+=Math.max(...opts.map(x=>x.t)); mH+=Math.max(...opts.map(x=>x.h)); mC+=Math.max(...opts.map(x=>x.c));
    Object.entries(o.a).forEach(([k,v])=>anc[k]+=v);
  });
  const yearsLevel = years<1?1: years<3?2: years<6?3: years<10?4:4.5;
  const dreyfus = Math.min(5, Math.max(1, 0.7*(sumD/nD)+0.3*yearsLevel));
  const tech = Math.min(100, (T/mT)*88 + Math.min(years,10)*1.2);
  const human = Math.min(100, (H/mH)*100);
  const conc = Math.min(100, (C/mC)*100);
  const prof={dreyfus,tech,human,conc};

  const fit=(t)=>{
    const [rd,rt,rh,rc]=t.req;
    let f=100 - Math.max(0,rd-dreyfus)*10 - 0.4*(Math.max(0,rt-tech)+Math.max(0,rh-human)+Math.max(0,rc-conc));
    const pref = t.type==="vertical"?anc.GM : t.type==="expert"?anc.TF+anc.CH : anc.SV+anc.EC+anc.AU;
    f += Math.min(5,pref)-2.5; // çıpa uyumu: -2.5..+2.5
    return Math.max(5,Math.min(98,Math.round(f)));
  };
  const scored=TARGETS.filter(t=>eligible(t,TITLES[S.titleIdx])).map(t=>({t,fit:fit(t)})).sort((a,b)=>b.fit-a.fit);
  const suggested=!S.targetId;
  // öneri modunda dikey yükselişe öncelik: sıralamaya +25 puan (gösterilen uyum skoru değişmez).
  // Bonus yalnızca profil o role gerçekten yakınsa verilir: Dreyfus en fazla 0,5 seviye, her beceri
  // boyutu en fazla 8 puan geride ve toplam uyum en az %60. Aksi halde hazır olmayan birini yönetici rolüne yönlendirmiş oluruz.
  const VERTICAL_BONUS=25, VERTICAL_MIN_FIT=60;
  const ready=t=>{ const [rd,rt,rh,rc]=t.req; return dreyfus>=rd-0.5 && tech>=rt-8 && human>=rh-8 && conc>=rc-8; };
  const rank=x=>x.fit+(x.t.type==="vertical"&&x.fit>=VERTICAL_MIN_FIT&&ready(x.t)?VERTICAL_BONUS:0);
  const pick=()=>[...scored].sort((a,b)=>rank(b)-rank(a))[0];
  const target = suggested ? pick() : scored.find(x=>x.t.id===S.targetId);

  const V=Math.max(0.5, anc.GM*2 + (conc-50)/10 + (human-50)/15);
  const E=Math.max(0.5, (anc.TF+anc.CH*0.5)*2 + (tech-50)/10);
  const L=Math.max(0.5, (anc.SV+anc.EC*1.5+anc.AU*0.7)*1.5 + (human-50)/15);
  // öneri modunda dikey rota da öne çıkarılır (hedef dikey bir rol seçildiyse)
  // dikey hedef önerildiyse rota da tutarlı olsun: dikey, en güçlü rakibinin %5 üstüne çıkar
  const vBoost = (suggested && target.t.type==="vertical" && ready(target.t)) ? Math.max(1.6, Math.max(E,L)/V*1.05) : 1;
  const sum=V*vBoost+E+L;
  const routes=[
    {id:"vertical",n:"Dikey Yükselme (Yöneticilik)",s:V*vBoost/sum},
    {id:"expert",n:"Derin Uzmanlık (Kıdemli Uzman / Teknik Referans)",s:E/sum},
    {id:"lateral",n:"Yatay Geçiş (Farklı departman / rol)",s:L/sum}
  ].sort((a,b)=>b.s-a.s);

  return {family,years,prof,anc,scored,target,suggested,routes};
}

function radar(prof,req){
  const cx=150,cy=140,R=95;
  const ang=[-90,30,150].map(a=>a*Math.PI/180);
  const pt=(v,i)=>[cx+R*(v/100)*Math.cos(ang[i]), cy+R*(v/100)*Math.sin(ang[i])];
  const poly=(vals)=>vals.map((v,i)=>pt(v,i).join(",")).join(" ");
  const grid=[25,50,75,100].map(g=>`<polygon points="${poly([g,g,g])}" fill="none" stroke="var(--line)"/>`).join("");
  const axes=ang.map((a,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(100,i)[0]}" y2="${pt(100,i)[1]}" stroke="var(--line)"/>`).join("");
  const lab=[["Teknik",cx,cy-R-10,"middle"],["Beşeri",cx+R*Math.cos(ang[1])+8,cy+R*Math.sin(ang[1])+18,"start"],["Kavramsal",cx+R*Math.cos(ang[2])-8,cy+R*Math.sin(ang[2])+18,"end"]]
    .map(l=>`<text x="${l[1]}" y="${l[2]}" text-anchor="${l[3]}" font-size="12" fill="var(--muted)">${l[0]}</text>`).join("");
  return `<svg viewBox="0 0 300 275" width="100%" style="max-width:300px" role="img" aria-label="Katz beceri dengesi grafiği">
    ${grid}${axes}
    <polygon points="${poly(req)}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".7"/>
    <polygon points="${poly([prof.tech,prof.human,prof.conc])}" fill="var(--brand)" fill-opacity=".22" stroke="var(--brand)" stroke-width="2"/>
    ${lab}</svg>`;
}
function gauge(p){
  const r=62,c=2*Math.PI*r, off=c*(1-p/100);
  const col = p>=80?"var(--good)":p>=60?"var(--brand)":"var(--warn)";
  return `<svg viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Uyum skoru %${p}">
    <circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--line)" stroke-width="13"/>
    <circle cx="80" cy="80" r="${r}" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 80 80)"/>
    <text x="80" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="var(--ink)">%${p}</text>
    <text x="80" y="100" text-anchor="middle" font-size="12" fill="var(--muted)">uyumlu</text></svg>`;
}

       body:"Öngörülebilirlik, iş güvencesi ve iyi bir ekip, sizin için kariyer kararlarında ağır basıyor."}

function computeMotivation(){
  const ti=QUESTIONS.findIndex(q=>q.id==="tradeoff"), vi=QUESTIONS.findIndex(q=>q.id==="values");
  const raw={ext:0,growth:0,auto:0,sec:0};
  const trade=QUESTIONS[ti].options({})[S.answers[ti].i];
  raw[trade.m]+=3;
  const rank=S.answers[vi].rank, vals=QUESTIONS[vi].values, w=[3,2,1];
  const statedRaw={ext:0,growth:0,auto:0,sec:0};
  rank.forEach((v,i)=>{ const m=vals.find(x=>x.v===v).m; raw[m]+=w[i]; statedRaw[m]+=w[i]; });
  const total=Object.values(raw).reduce((a,b)=>a+b,0);
  const share=Object.fromEntries(Object.entries(raw).map(([k,v])=>[k,Math.round(v/total*100)]));
  const firstDim=vals.find(x=>x.v===rank[0]).m;
  const order=Object.keys(raw).sort((a,b)=>raw[b]-raw[a]||(a===firstDim?-1:b===firstDim?1:0));
  return {share,top:order[0],second:order[1],stated:firstDim,revealed:trade.m,
          payTitle: rank.includes("pay")&&!rank.includes("title")?"pay": rank.includes("title")&&!rank.includes("pay")?"title": trade.x||""};
}
function motivationSection(R){
  const M=computeMotivation(), t=R.target.t, p=R.prof, top=MOT[M.top];
  // hedefle ilişkilendirme
  let link="";
  if(M.top==="ext"){
    if(t.type==="vertical") link = p.conc<t.req[3]
      ? `Hedefiniz (${esc(t.n)}) gelir ve unvan beklentinizi destekleyen bir yol; ancak kavramsal beceri puanınız ${Math.round(p.conc)}, hedef ise ${t.req[3]}. Bu boşluğu kapatmadan geçiş zor olabilir.`
      : `Hedefiniz (${esc(t.n)}) gelir ve unvan beklentinizle örtüşüyor ve beceri profiliniz bu yola uygun görünüyor.`;
    else link=`Hedefiniz (${esc(t.n)}) yönetici olmayan bir yol. Unvan ve gelir sizin için önemliyse, Kıdemli Uzman / Teknik Referans basamaklarının unvan ve gelir karşılığını İK ile netleştirin; bu bilgi kuruma özgüdür.`;
    if(M.payTitle==="title") link+=" Not: unvan (statü) gelirden daha ağır basıyor; bu durumda rolün unvan basamaklarını ve terfi kriterlerini öğrenmek öncelikli olabilir.";
    if(M.payTitle==="pay") link+=" Not: gelir unvandan daha ağır basıyor; bu durumda hangi rolün hangi gelir basamağına denk geldiğini öğrenmek öncelikli olabilir.";
  } else if(t.type==="vertical"){
    const loss={growth:"yönetici rolünde günlük işin ağırlığı teknik problem çözmekten insan, bütçe ve koordinasyona kayar; öğrenme alanınız değişir",
                auto:"yönetici rolünde takviminiz ve önceliklerinizin büyük kısmı başkalarının ihtiyaçlarıyla belirlenir; özerklik ve denge çoğu zaman azalır",
                sec:"yönetici rolünde sorumluluk ve belirsizlik artar; öngörülebilirlik çoğu zaman azalır"}[M.top];
    link=`Hedefiniz (${esc(t.n)}) yönetici yoluna işaret ediyor, ancak ana motivasyonunuz "${top.n}". Dikkat: ${loss}. Karar vermeden önce bu rolde çalışan biriyle bir iş gününü birlikte geçirmenizi öneririm.`;
  } else if(M.top==="sec" && t.type==="lateral"){
    link=`Hedefiniz (${esc(t.n)}) bir yatay geçiş ve geçiş döneminde geçici belirsizlik olur. Güvence sizin için önemli olduğundan ani geçiş yerine gölgeleme ve rotasyonla kademeli ilerleyin.`;
  } else {
    link=`Hedefiniz (${esc(t.n)}) ana motivasyonunuz olan "${top.n}" ile uyumlu görünüyor.`;
  }
  const consistency = M.stated===M.revealed
    ? "Sıralamada belirttiğiniz ilk değer ile ödünleşim senaryosundaki tercihiniz tutarlı."
    : `Sıralamada ilk sırayı <strong>${MOT[M.stated].n}</strong> aldı, ödünleşim senaryosunda ise <strong>${MOT[M.revealed].n}</strong> yönünü seçtiniz. Bu fark gerçek bir ikilemin işareti olabilir; bir teklif geldiğinde hangisinden vazgeçmeyi göze aldığınızı önceden netleştirin.`;
  const bars=Object.entries(M.share).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><div class="l"><span>${MOT[k].n}</span><span>%${v}</span></div><div class="t"><b style="width:${v}%"></b></div></div>`).join("");
  return `<div class="sec c7">
    <h3>${ico("coin")}Motivasyon Profili · Neyi Önceliklendiriyorsunuz?</h3>
    <p style="margin:0 0 8px"><strong>Baskın motivasyonunuz: ${top.n}.</strong> ${top.body}</p>
    ${bars}
    <p style="margin:10px 0 6px">${link}</p>
    <p class="hint" style="margin-top:6px">${consistency}</p>
    <p style="margin:12px 0 4px"><strong>Bir teklifi değerlendirirken kendinize sorun:</strong></p>
    <ul style="margin:0;padding-left:18px;font-size:14px">
      <li>Bu teklif, bana en önemli olan "${top.n}" konusunda 12 ay sonra ne sağlıyor?</li>
      <li>Karşılığında vazgeçeceğim şey (gelir, öğrenme, özerklik, güvence) ne ve buna razı mıyım?</li>
      <li>Günlük işim nasıl değişiyor, bu değişiklik beni enerjilendirir mi?</li>
      <li>Memnun kalmazsam geri dönüş seçeneğim var mı?</li>
    </ul>
    <p style="margin:12px 0 4px"><strong>Yöneticinizle konuşmak için bir başlangıç:</strong> "Önümüzdeki 12 ayda benim için ilerleme şu şekilde ölçülsün: ${top.measure}."</p>
    <p class="note">Bu profil bir eğilim gösterir, kalıcı bir kişilik etiketi değildir. Ekonomik koşullar ve yaşam evresi önceliklerinizi değiştirebilir. Maaş ve unvan meşru kariyer hedefleridir; amaç hangi önceliğin doğru olduğuna karar vermek değil, tercihlerinizi bilinçli yapmanızı sağlamaktır.</p>
  </div>`;
}

/* ============ YÖNETİCİ ADAYLIĞINA HAZIRLIK ============ */
const MGR_ACTIONS={
  tech:"Yönetici olmak için ekibin en derin uzmanı olmanız gerekmez, ancak ekibin teknik güvenini kazanmanız gerekir. Zor vakalarda sistematik kök neden analizi yapıp dokümante edin, platform sertifikalarınızı tamamlayın ve ekibe teknik bir konuyu anlatın.",
  human:"Bir junior çalışana resmi mentorluk yapın, ekip toplantısının bir bölümünü yönetin, yapıcı geri bildirim verme ve zor bir görüşmeyi yönetme pratiği için çatışma yönetimi eğitimi alın.",
  conc:"Ekibiniz veya bölgeniz için ölçülebilir bir iyileştirme projesi (ilk seferde çözüm oranı, MTTR) yürütün; kapasite ve yedek parça planlamasında rol alın, kalite ve ürün ekipleriyle çapraz çalışın.",
  dreyfus:"Standart prosedürün ötesinde karar verdiğiniz durumları artırın. Belirsiz arızalarda kararınızı ve gerekçenizi yazılı hale getirip ekibe aktarın; bağlamı okuyarak karar verme, yönetici rolünün temel gereğidir."
};
function managerReadiness(R){
  const t0=R.target.t, userVertical=t0.type==="vertical";
  if(!userVertical && R.anc.GM<3) return "";          // dikey yola ilgisi belirgin değilse gösterme
  const ref = userVertical ? t0 : TARGETS.find(x=>x.id==="lead");
  const [rd,rt,rh,rc]=ref.req, p=R.prof;
  const dims=[
    {k:"tech",n:"Teknik beceri",v:p.tech,r:rt,tol:8},
    {k:"human",n:"Beşeri beceri (iletişim)",v:p.human,r:rh,tol:8},
    {k:"conc",n:"Kavramsal beceri (liderlik)",v:p.conc,r:rc,tol:8},
    {k:"dreyfus",n:"Dreyfus uzmanlık seviyesi",v:p.dreyfus,r:rd,tol:0.5,scale:10}
  ].map(d=>({...d,gap:Math.max(0,(d.r-d.v)*(d.scale||1)), ok:d.v>=d.r-d.tol}));
  const open=dims.filter(d=>!d.ok).sort((a,b)=>b.gap-a.gap);
  const total=dims.reduce((a,d)=>a+d.gap,0);
  const attain=Math.round(dims.reduce((a,d)=>a+Math.min(1,d.v/d.r),0)/dims.length*100);
  const status = open.length===0
    ? {t:"Hazırsınız",c:"good",m:"Dikey yol için gereken beceri eşiklerini karşılıyorsunuz. Sıradaki adım, yöneticinizle aday olma niyetinizi konuşmak ve vekâleten sorumluluk almak."}
    : total<=20 ? {t:"Hazırlığa yakınsınız",c:"warn",m:"Birkaç belirli alanda küçük açıklarınız var. Hedefli gelişimle kısa sürede kapanabilir."}
    : {t:"Henüz hazır değilsiniz",c:"warn",m:"Bu bir engel değil, bir plandır. Önce aşağıdaki boşlukları kapatın, ardından yönetici adaylığına başvurun."};
  const months = open.length===0?"hemen":total<=12?"yaklaşık 6 ay":total<=30?"9–12 ay":total<=55?"12–18 ay":"18–24 ay ve üzeri";
  return `<div class="sec c8">
    <h3>${ico("up")}Yönetici Adaylığına Hazırlık${userVertical?"":" · Dikey yola ilerlemek isterseniz"}</h3>
    <p style="margin:0 0 8px">Referans rol: <strong>${esc(ref.n)}</strong> · Hazırlık düzeyi: <span class="chip ${status.c}">${status.t} · %${attain}</span></p>
    <p style="margin:0 0 10px">${status.m}</p>
    ${dims.map(d=>`<div class="bar"><div class="l"><span>${d.n} ${d.ok?'<span class="chip good" style="margin:0 0 0 4px">Karşılıyor</span>':'<span class="chip warn" style="margin:0 0 0 4px">Boşluk</span>'}</span><span>${d.k==="dreyfus"?d.v.toFixed(1):Math.round(d.v)} / hedef ${d.r}</span></div><div class="t"><b style="width:${d.k==="dreyfus"?d.v/5*100:Math.round(d.v)}%"></b><u style="left:${d.k==="dreyfus"?d.r/5*100:d.r}%"></u></div></div>`).join("")}
    ${open.length?`<p style="margin:14px 0 4px"><strong>Önce kapatılması gereken boşluklar (en büyükten başlayarak):</strong></p>
    <ol style="margin:0;padding-left:20px;font-size:14px">${open.map(d=>`<li style="margin-bottom:8px"><strong>${d.n}</strong>${d.k==="dreyfus"?"":` (${Math.round(d.r-d.v)} puan geride)`}: ${MGR_ACTIONS[d.k]}</li>`).join("")}</ol>
    <p style="margin:10px 0 0"><strong>Kaba süre tahmini:</strong> ${months}. Bu, puanlardaki toplam fark üzerinden yapılmış genel bir tahmindir; gerçek süre fırsatlara ve yöneticinizin desteğine bağlıdır.</p>`:""}
    <p style="margin:14px 0 4px"><strong>Hazır olduğunuzu nasıl anlarsınız?</strong></p>
    <ul style="margin:0;padding-left:20px;font-size:14px">
      <li>Teknik, beşeri ve kavramsal becerinizin her biri hedefin en fazla 8 puan altında veya üstünde.</li>
      <li>Dreyfus seviyeniz en az ${(rd-0.5).toFixed(1)}.</li>
      <li>En az bir ölçülebilir iyileştirme projesi veya vekâleten liderlik deneyiminiz var.</li>
      <li>Yöneticiniz sizi ekip lideri adayı olarak görüyor ve bunu yazılı geri bildirimle teyit edebiliyor.</li>
    </ul>
    ${userVertical?"":`<p class="hint">Not: Şu anki profilinize en uygun hedef <strong>${esc(t0.n)}</strong> olarak önerildi. Dikey yol buna paralel veya sonrası için bir seçenek olarak durabilir.</p>`}
  </div>`;
}

function renderReport(){
  setStep(3);
  const R=compute(), p=R.prof, t=R.target.t, fit=R.target.fit;
  const DISCS = S.wantDisc ? computeDisc(p) : [];
  const WEAK={interest:"ilgi düzeyi düşük; önce bu alanı yakından tanımak için bir departman çalışanıyla görüşün.",apt:"disiplin senaryosundaki yaklaşımınız bu alanın beklentisinden uzak; bu alanın tipik karar mantığını (ticari, planlama veya uyumluluk bakışı) pratik edin.",tr:"bugünkü görevlerinizle örtüşme az; hedef disiplinden bir görevi proje olarak üstlenmek köprüyü kurar.",pr:"genel beceri profiliniz bu alanın gerektirdiğinden geride; ilgili beceriyi (iletişim, süreç yönetimi veya teknik derinlik) geliştirin."};
  DISCS.forEach(d=>{ const e=Object.entries(d.parts).sort((a,b)=>a[1]-b[1])[0]; d.weakest = e[1]<60 ? WEAK[e[0]] : ""; });
  const topAnc=Object.entries(R.anc).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0).slice(0,3);
  const maxA=Math.max(1,...topAnc.map(x=>x[1]));
  const lvl=Math.round(p.dreyfus);
  const [rd,rt,rh,rc]=t.req;
  const rows=[
    ["Teknik Beceri",p.tech,rt,"tech"],["Beşeri Beceri (İletişim)",p.human,rh,"human"],["Kavramsal Beceri (Liderlik)",p.conc,rc,"conc"]
  ];
  const strengths=[], gaps=[];
  rows.forEach(([n,v,r,k])=>{ (v>=r-5?strengths:gaps).push({n,v:Math.round(v),r,k}); });
  (p.dreyfus>=rd-0.3?strengths:gaps).push({n:"Dreyfus Uzmanlık Seviyesi",v:p.dreyfus.toFixed(1),r:rd,k:"dreyfus"});

  const top=R.routes[0], title=TITLES[S.titleIdx].v;
  const routeBlock=(r,rec)=>`<div class="route ${rec?"rec":""}"><h4>${esc(r.n)} ${rec?'<span class="chip" style="margin-left:6px">Önerilen</span>':""}</h4>
     <div class="bar"><div class="t"><b style="width:${Math.round(r.s*100)}%"></b></div></div>
     <div class="hint">Profil yatkınlığı: %${Math.round(r.s*100)}</div></div>`;

  let mismatch="";
  if(!R.suggested && t.type!==top.id){
    const lbl={vertical:"dikey",expert:"derin uzmanlık",lateral:"yatay"};
    mismatch=`<p><strong>Dikkat:</strong> Hedefiniz <em>${esc(t.n)}</em> ağırlıklı olarak <em>${lbl[t.type]}</em> bir yol; ancak motivasyon çıpalarınız ve beceri dengeniz <em>${esc(top.n)}</em> rotasına daha yatkın görünüyor. Bu bir engel değil; hedefi koruyabilirsiniz, ancak gelişim planını bu farkı bilerek kurmanız gerekir.</p>`;
  }
  if(R.suggested && t.type==="vertical" && fit<70){
    mismatch+=`<p><strong>Not:</strong> Dikey yükselişi öncelikli tuttuğum için bu pozisyonu önerdim; mevcut uyumunuz %${fit}. Aşağıdaki 'Geliştirilmesi gereken yetkinlikler' bölümü bu farkı kapatmak için ilk odak noktanız olmalı.</p>`;
  }
  const phases=PHASES[top.id];
  const verdict = fit>=80?"Profiliniz hedefle büyük ölçüde örtüşüyor; kısa vadede hazır olmanızı sağlayacak küçük gelişim adımları yeterli olabilir."
    : fit>=60?"Temel uyum var; birkaç belirli yetkinlikte hedeflenmiş gelişim ile 12–18 ay içinde güçlü aday olabilirsiniz."
    : "Hedef ile mevcut profil arasında belirgin bir fark var; bu bir engel değil, planlı bir gelişim yolculuğu gerektiriyor.";

  app.innerHTML=`
  <div class="rep" id="report">
    <div class="sec hero-sec c1">
      ${DECO_SVG}
      <h2>Kariyer Öz Değerlendirme Raporu</h2>
      <div class="meta">${S.name?esc(S.name)+" · ":""}${esc(title)} · ${YEARS[S.yearsIdx].v} · ${new Date().toLocaleDateString("tr-TR")}</div>
      <div class="hero">
        <div>${gauge(fit)}</div>
        <div>
          <div class="big">${R.suggested?"Size önerilen hedef pozisyon":"Hedeflenen pozisyona uyum skoru"}</div>
          <h3 style="font-size:19px;margin:2px 0 8px">${esc(t.n)}</h3>
          <div>
            <span class="chip">Dreyfus: ${DREYFUS[lvl]}</span>
            ${topAnc.map(([k])=>`<span class="chip good">${esc(ANCHORS[k])}</span>`).join("")}
          </div>
          <p style="margin:6px 0 0;color:var(--muted);font-size:14px">${verdict}</p>
          ${R.suggested?`<p class="hint">Not: Hedef belirtmediğiniz için ${R.scored.length} olası pozisyon arasından, dikey yükselişi öncelikli tutarak profilinize en uygun olanı seçtim.</p>`:""}
        </div>
      </div>
    </div>

    <div class="sec c2">
      <h3>${ico("radar")}Beceri Dengesi · Katz Modeli</h3>
      <div class="two">
        <div style="text-align:center">${radar(p,[rt,rh,rc])}<div class="hint">Dolu alan: mevcut profiliniz · Kesikli çizgi: hedef pozisyon beklentisi</div></div>
        <div>
          ${rows.map(([n,v,r])=>`<div class="bar"><div class="l"><span>${n}</span><span>${Math.round(v)} / hedef ${r}</span></div><div class="t"><b style="width:${Math.round(v)}%"></b><u style="left:${r}%"></u></div></div>`).join("")}
          <div class="bar"><div class="l"><span>Dreyfus Seviyesi</span><span>${p.dreyfus.toFixed(1)} / hedef ${rd}</span></div><div class="t"><b style="width:${p.dreyfus/5*100}%"></b><u style="left:${rd/5*100}%"></u></div></div>
        </div>
      </div>
    </div>

    <div class="sec c3">
      <h3>${ico("gap")}Boşluk Analizi (Gap Analysis)</h3>
      <div class="two">
        <div>
          <p style="margin:0 0 6px;font-weight:600;color:var(--good)">Güçlü yönleriniz</p>
          ${strengths.length?strengths.map(s=>`<div class="gap g"><h4>${s.n}</h4><p>Mevcut ${s.v} · hedef ${s.r}. Bu alan hedef pozisyonun beklentisini karşılıyor.</p></div>`).join(""):"<p class='hint'>Bu hedef için henüz beklentiyi karşılayan bir alan görünmüyor; gelişim planı tüm alanlarda dengeli ilerlemeli.</p>"}
        </div>
        <div>
          <p style="margin:0 0 6px;font-weight:600;color:var(--warn)">Geliştirilmesi gereken yetkinlikler</p>
          ${gaps.length?gaps.map(s=>`<div class="gap w"><h4>${s.n} <span class="chip warn">${s.v} → ${s.r}</span></h4><p>${ACTIONS[s.k]}</p></div>`).join(""):"<p class='hint'>Belirgin bir eksik yok; odak sürdürülebilirlik ve görünürlük olmalı.</p>"}
        </div>
      </div>
    </div>

    <div class="sec c4">
      <h3>${ico("compass")}Kariyer Çıpalarınız · Schein</h3>
      ${topAnc.map(([k,v])=>`<div class="bar"><div class="l"><span>${esc(ANCHORS[k])}</span></div><div class="t"><b style="width:${Math.round(v/maxA*100)}%"></b></div></div>`).join("")}
    </div>

    ${motivationSection(R)}

    <div class="sec c5">
      <h3>${ico("map")}Kariyer Yolu Haritası</h3>
      ${R.routes.map((r,i)=>routeBlock(r,i===0)).join("")}
      ${mismatch}
      <p style="margin:12px 0 4px"><strong>${esc(top.n)}</strong> rotası için önerilen adımlar:</p>
      ${top.id==="lateral"?`<p class="hint" style="margin-top:0">Rolünüze göre olası yatay hedefler: ${esc(LATERAL_DEST[R.family])}.</p>`:""}
      <div class="phases">
        ${phases.map(ph=>`<div class="phase"><h5>${ph[0]}</h5><ul>${ph[1].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}
      </div>
      <p class="note">Bu rapor durumsal sorulara dayalı bir öz değerlendirmedir; Dreyfus, Katz ve Schein modellerinin basitleştirilmiş bir uygulamasıdır. Psikometrik bir test veya performans değerlendirmesi yerine geçmez; yöneticiniz ve İK ile yapacağınız kariyer görüşmesi için bir başlangıç noktası olarak kullanın.</p>
    </div>

    ${managerReadiness(R)}

    ${!S.wantDisc ? `<div class="sec c6 no-print"><h3>${ico("brief")}Farklı disiplinlerde kariyer</h3>
      <p style="margin:0 0 10px">Disiplin keşfi bölümünü atladınız. İsterseniz satış, pazarlama, tedarik zinciri ve kalite alanlarına uygunluğunuzu şimdi ölçebilirsiniz; sonuç bu rapora eklenir.</p>
      <button class="btn" id="goDisc">Disiplin keşfini yap →</button></div>` : `<div class="sec c6">
      <h3>${ico("brief")}Disiplin Haritası · Farklı Alanlarda Kariyer</h3>
      <p class="hint" style="margin-top:0">Her disiplin dört kaynaktan hesaplandı: ilgi (%30), disiplin senaryosundaki yatkınlık (%30), bugünkü görevlerinizden aktarılabilir beceri (%25) ve genel beceri profiliniz (%15).</p>
      ${DISCS.map((d,i)=>{
        const lbl=d.score>=70?["Güçlü uyum","good"]:d.score>=50?["Geliştirilebilir","warn"]:["Şu an düşük uyum",""];
        const w=d.weakest;
        return `<div class="disc ${i===0?"top":""}">
          <div class="h"><span>${esc(d.D.n)} ${i===0?'<span class="chip" style="margin-left:6px">En yüksek uyum</span>':""}</span><span class="chip ${lbl[1]}">${lbl[0]} · %${d.score}</span></div>
          <div class="bar" style="margin:6px 0 2px"><div class="t"><b style="width:${d.score}%"></b></div></div>
          <div class="parts">İlgi ${d.parts.interest} · Yatkınlık ${d.parts.apt} · Aktarılabilir beceri ${d.parts.tr} · Profil ${d.parts.pr}</div>
          ${i===0||d.score>=60?`<p><strong>Tipik gün:</strong> ${esc(d.D.typical)}</p><p><strong>Köprü rol:</strong> ${esc(d.D.bridge)}</p><p><strong>İlk adım:</strong> ${esc(d.D.first)}</p>`
                             :`<p class="hint">Bu alan şu an öncelikli görünmüyor; ilgi ve yatkınlık zamanla değişebilir.</p>`}
          ${i===0&&w?`<p><strong>En zayıf bileşen:</strong> ${w}</p>`:""}
        </div>`;}).join("")}
      ${S.discMode==="pick"?`<p class="hint">Yalnızca seçtiğiniz disiplinler değerlendirildi; ilgi puanı tek bir soruyla ölçüldü (üç ve üzeri disiplinde sıralama, iki disiplinde tercih, tek disiplinde ilgi derecesi). İki ve üzeri disiplinde birinci tercihinizin mutlak ilgi düzeyi ayrıca doğrulandı. Seçmediğiniz disiplinler karşılaştırmaya dahil edilmedi; bu nedenle skorlar dört disiplinli değerlendirmeyle birebir kıyaslanamaz.</p>`:""}
      <p class="note">Disiplin haritası bir yönlendirme başlangıcıdır. Gerçek doğrulama, ilgilendiğiniz departmanda gölgeleme (job shadowing), kısa görevlendirme ve yönetici/İK görüşmesiyle yapılmalıdır.</p>
    </div>`}

    <div class="actions no-print">
      <button class="btn" id="pdf">PDF olarak indir / yazdır</button>
      <button class="btn ghost" id="restart">Yeniden başla</button>
    </div>
    <p class="hint no-print">PDF için açılan pencerede hedef olarak "PDF olarak kaydet" seçeneğini kullanın.</p>
  </div>`;
  document.getElementById("pdf").addEventListener("click",()=>window.print());
  const gd=document.getElementById("goDisc");
  if(gd) gd.addEventListener("click",()=>{ S.wantDisc=undefined; S.screen="dchoice"; render(); });
  document.getElementById("restart").addEventListener("click",()=>{
    S.answers=[];S.pick=null;S.dAns={};S.wantDisc=undefined;S.discMode=undefined;S.discSel=[];S.screen="intro";render();
  });
}

function render(){
  document.getElementById("stepper").style.display = S.screen==="cover" ? "none" : "";
  if(S.screen==="cover") renderCover();
  else if(S.screen==="intro") renderIntro();
  else if(S.screen==="report") renderReport();
  else if(S.screen==="dchoice") renderChoice();
  else if(S.screen==="dsel") renderDiscSelect();
  else if(S.screen[0]==="d") renderDisc(+S.screen.slice(1));
  else renderQuestion(+S.screen.slice(1));
  window.scrollTo({top:0});
}
render();
</script>
</body>
</html>
